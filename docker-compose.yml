services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      SQLITE_PATH: /app/.data/shoppluscol.db
      STORAGE_DRIVER: local
      MEDIA_PUBLIC_URL: http://localhost:3000/uploads
    ports:
      - "3000:3000"
    volumes:
      - shoppluscol-data:/app/.data
      - shoppluscol-uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  shoppluscol-data:
  shoppluscol-uploads:
